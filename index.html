<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heitor Costa Perdigão</title>
  <meta name="description" content="Currículo e projetos de Heitor Costa Perdigão, desenvolvedor e fundador da NoxusSoft.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="demo" class="demo" hidden>Conteúdo de exemplo. Edite o arquivo data.js.</p>

  <button id="theme" class="theme" type="button"></button>
  <div class="layout">
    <aside class="side">
      <div>
        <h1 id="name"></h1>
        <p class="role" id="role"></p>
        <p class="intro" id="intro"></p>
        <nav id="nav" aria-label="Seções">
          <a href="#sobre">Sobre</a>
          <a href="#projetos">Projetos</a>
          <a href="#experiencia">Experiência</a>
          <a href="#formacao">Formação</a>
          <a href="#habilidades">Habilidades</a>
          <a href="#contato">Contato</a>
        </nav>
      </div>
      <p id="links" class="links"></p>
    </aside>

    <main>
      <section id="sobre">
        <h2>Sobre</h2>
        <div id="about"></div>
      </section>

      <section id="projetos">
        <h2>Projetos</h2>
        <p class="hint">Clique em um projeto para ver como ele foi feito.</p>
        <div id="projects"></div>
      </section>

      <section id="experiencia">
        <h2>Experiência</h2>
        <div id="experience"></div>
      </section>

      <section id="formacao">
        <h2>Formação</h2>
        <div id="education"></div>
      </section>

      <section id="habilidades">
        <h2>Habilidades</h2>
        <div id="skills"></div>
      </section>

      <section id="contato">
        <h2>Contato</h2>
        <p id="contact" class="contact"></p>
      </section>
    </main>
    <footer id="foot" class="foot"></footer>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
